name: Generate snake animation

on:
  # every push of the main branch
  push:
    branches:
    - main
  # automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"
  
  # manually
  workflow_dispatch:

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#87192d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#87192d
          
          
      - name: push github-contribution-grid-snake.svg to the snake branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
